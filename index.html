<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bilardo Kaosu: Roguelite</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; 
            background-color: #1a252f;
            color: white;
            font-family: Arial, sans-serif;
            position: fixed;
            inset: 0; 
            display: flex;
            justify-content: center;
            overflow: hidden; 
            touch-action: none;
        }

        #gameWrapper {
            width: 100%;
            height: 100%;
            max-width: 420px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 10px;
            box-sizing: border-box;
            gap: 10px; 
            position: relative;
        }
        
        h2 { margin: 5px 0 0 0; font-size: 18px; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; color: #f39c12; }

        #canvasContainer {
            flex: 1; 
            width: 100%;
            min-height: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background-color: #27ae60;
            border: 5px solid #2c3e50;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 2; 
            display: block;
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #info {
            text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; flex-shrink: 0; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;
        }
        
        .stats-row { display: flex; justify-content: space-around; font-weight: bold; }

        /* ROGUELITE KART EKRANI */
        #upgradeOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; 
            border-radius: 12px; backdrop-filter: blur(4px);
            pointer-events: auto; 
        }
        #upgradeOverlay h3 { color: #f1c40f; margin-bottom: 20px; font-size: 22px; text-align: center; text-shadow: 0 0 10px rgba(241,196,15,0.5); }
        
        #cardsContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: #34495e; width: 85%; padding: 15px; border-radius: 10px;
            border: 2px solid #95a5a6;
            cursor: pointer; transition: transform 0.1s, border-color 0.1s;
            pointer-events: auto; 
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.95); }
        .card-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 5px; border-bottom: 1px solid #7f8c8d; padding-bottom: 3px; pointer-events: none; }
        .card-pro { color: #2ecc71; font-size: 12px; margin-bottom: 3px; pointer-events: none; }
        .card-con { color: #bdc3c7; font-size: 12px; pointer-events: none; }

    </style>
</head>
<body>

    <div id="gameWrapper">
        <h2>Bilardo Kaosu: Roguelite</h2>
        
        <div id="canvasContainer">
            <canvas id="gameCanvas" width="400" height="800"></canvas>
            
            <div id="upgradeOverlay">
                <h3>Oda Temizlendi!<br><span style="font-size:14px; color:#bdc3c7;">Süper Bir Güç Seç</span></h3>
                <div id="cardsContainer"></div>
            </div>
        </div>

        <div id="info">
            <div class="stats-row">
                <div>Seviye: <span id="levelDisplay" style="color: #9b59b6;">1</span></div>
                <div>Atış: <span id="shotCount" style="color: #f1c40f;">0</span></div>
            </div>
            <div style="font-size: 12px; color: #bdc3c7;">Top: <span id="ballCount">0</span>/100 | Aktif: <span id="perksDisplay" style="font-size:10px;">Yok</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballCountEl = document.getElementById('ballCount');
        const shotCountEl = document.getElementById('shotCount');
        const levelDisplayEl = document.getElementById('levelDisplay');
        const perksDisplayEl = document.getElementById('perksDisplay');
        const upgradeOverlay = document.getElementById('upgradeOverlay');
        const cardsContainer = document.getElementById('cardsContainer');

        const FRICTION = 0.985; 
        const MAX_BALLS = 100;  
        const MIN_SPEED_TO_SPLIT = 1.0; 
        const MAX_SPEED = 30; 

        const ALL_PERKS = [
            { id: 'vortex', title: '🌀 Girdap Delikleri', pro: '+ Kırmızı toplar deliklere yaklaşınca içeri emilir.', con: '- Beyaz top deliklere hafif çekilebilir.', color: '#9b59b6' },
            { id: 'explode', title: '💥 Bomba Atış', pro: '+ İlk çarpışmada etraftaki topları şiddetle fırlatır.', con: '- Beyaz top da patlamadan etkilenip seker.', color: '#e74c3c' },
            { id: 'ice', title: '❄️ Buzlu Masa', pro: '+ Sürtünme azalır! Toplar yağ gibi kayar.', con: '- Topların durması daha uzun sürer.', color: '#1abc9c' },
            { id: 'shield', title: '🛡️ Kaos Kalkanı', pro: '+ Duvar çoğaltması zayıflar. Toplar az bölünür.', con: '- Yok (Tamamen güvenli temizlik)', color: '#f1c40f' },
            { id: 'mini', title: '🔬 Mikro Hedefler', pro: '+ Hedef toplar %30 küçülür, deliklere çok kolay girer.', con: '- Hedefleri nişan alması bir tık zorlaşır.', color: '#e67e22' },
            { id: 'combo_score', title: '✨ Sihirli Kombo', pro: '+ Aynı atışta 2+ top sokarsan Atış Sayın 1 azalır (-1 Skor).', con: '- Yok (Skor düşürmek için harika)', color: '#2ecc71' }
        ];
        
        let activePerks = [];
        let currentLevel = 1;
        let totalShots = 0;
        let comboAppliedThisShot = false;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let lastSoundTime = 0; 
        let gameEnded = false; 

        function initAudioEngine() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type, pitchModifier = 1) {
            initAudioEngine();
            if (!audioCtx || audioCtx.state === 'suspended') return;
            let nowTime = Date.now();
            if ((type === 'collide' || type === 'wall' || type === 'bumper') && nowTime - lastSoundTime < 25) return;
            if (type === 'collide' || type === 'wall' || type === 'bumper') lastSoundTime = nowTime;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wall') {
                osc.type = 'square'; osc.frequency.setValueAtTime(180, now); gainNode.gain.setValueAtTime(0.03, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'collide') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(550 * pitchModifier, now); gainNode.gain.setValueAtTime(0.04, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.04); osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'pocket') {
                osc.type = 'sine'; let freq = 250 + (pitchModifier * 60); osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.15); gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'powerup') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now+0.1); osc.frequency.setValueAtTime(800, now+0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'bumper') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        window.addEventListener('touchstart', initAudioEngine, { once: true });
        window.addEventListener('mousedown', initAudioEngine, { once: true });

        // --- Oyun Değişkenleri ---
        let balls = [];
        let particles = []; 
        let comboTexts = []; 
        let obstacles = []; 
        
        let pockets = [
            {x: 0, y: 0, r: 40}, {x: 400, y: 0, r: 40},       
            {x: 0, y: 400, r: 29}, {x: 400, y: 400, r: 29},   
            {x: 0, y: 800, r: 40}, {x: 400, y: 800, r: 40}    
        ];

        let isDragging = false;
        let dragStart = {x: 0, y: 0};
        let dragCurrent = {x: 0, y: 0};
        let cueBall = null;

        let gameState = 'playing'; 
        let ballIdCounter = 1; 
        let currentCombo = 0; 

        class Obstacle {
            constructor(x, y, r, isMoving) {
                this.x = x; this.y = y; this.r = r;
                this.isMoving = isMoving;
                if (isMoving) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = 1.0 + Math.random() * 1.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    this.vx = 0; this.vy = 0;
                }
            }
            update() {
                if (!this.isMoving) return;
                this.x += this.vx; this.y += this.vy;
                if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
                if (this.x + this.r > canvas.width) { this.x = canvas.width - this.r; this.vx *= -1; }
                if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
                if (this.y + this.r > canvas.height) { this.y = canvas.height - this.r; this.vy *= -1; }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = '#2c3e50'; ctx.fill(); ctx.lineWidth = 4;
                ctx.strokeStyle = this.isMoving ? '#e67e22' : '#95a5a6'; ctx.stroke(); ctx.closePath();
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = this.isMoving ? 'rgba(230, 126, 34, 0.5)' : 'rgba(149, 165, 166, 0.5)';
                ctx.fill(); ctx.closePath();
            }
        }

        class Particle {
            constructor(x, y, color = null) {
                this.x = x; this.y = y;
                let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 2;
                const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff00ff', '#00ff00'];
                this.color = color || colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.alpha -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
        }

        class ComboText {
            constructor(x, y, textStr, isDeduction = false) {
                this.x = Math.max(50, Math.min(canvas.width - 50, x)); this.y = Math.max(60, Math.min(canvas.height - 40, y - 20));
                this.alpha = 1; this.scale = 1.5;
                this.text = textStr;
                this.color = isDeduction ? "#2ecc71" : "#ffffff";
                if (!isDeduction) {
                    let count = parseInt(textStr.replace(/\D/g, ''));
                    if (count >= 8) { this.color = "#ff00ff"; }
                    else if (count >= 5) { this.color = "#f1c40f"; }
                    else if (count >= 3) { this.color = "#3498db"; }
                }
            }
            update() { this.y -= 0.5; this.alpha -= 0.02; if(this.scale > 1) this.scale -= 0.04; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.font = `bold ${Math.floor(16 * this.scale)}px Arial`; ctx.textAlign = 'center'; ctx.fillText(this.text, this.x, this.y); ctx.restore(); }
        }

        class Ball {
            constructor(x, y, radius, color, type, number = 0) {
                this.x = Number.isFinite(x) ? x : 200; 
                this.y = Number.isFinite(y) ? y : 400; 
                this.vx = 0; this.vy = 0; this.radius = radius; this.color = color;
                this.type = type; this.number = number; this.multiplyCooldown = 15; 
                this.mass = 1; this.canExplode = false; 
            }
            draw() {
                if (!Number.isFinite(this.x) || !Number.isFinite(this.y)) { this.x = 200; this.y = 400; this.vx = 0; this.vy = 0; }
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.closePath();
                ctx.beginPath(); ctx.fillStyle = "rgba(255, 255, 255, 0.3)"; ctx.arc(this.x - 3, this.y - 3, this.radius / 3, 0, Math.PI * 2); ctx.fill(); ctx.closePath();
                if (this.type === 'target') {
                    ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.number, this.x, this.y + 1);
                }
            }
            update() {
                if (this.multiplyCooldown > 0) this.multiplyCooldown--;
                let currentSpeed = Math.hypot(this.vx, this.vy);
                if (currentSpeed > MAX_SPEED) { let ratio = MAX_SPEED / currentSpeed; this.vx *= ratio; this.vy *= ratio; }
                this.x += this.vx; this.y += this.vy;
                let currentFriction = activePerks.some(p => p.id === 'ice') ? 0.994 : FRICTION;
                this.vx *= currentFriction; this.vy *= currentFriction;
                if (Math.abs(this.vx) < 0.05) this.vx = 0; if (Math.abs(this.vy) < 0.05) this.vy = 0;
                let hitWall = false;
                if (this.x - this.radius <= 0) { this.x = this.radius; this.vx *= -1; hitWall = true; } 
                else if (this.x + this.radius >= canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; hitWall = true; }
                if (this.y - this.radius <= 0) { this.y = this.radius; this.vy *= -1; hitWall = true; } 
                else if (this.y + this.radius >= canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; hitWall = true; }
                if (hitWall) playSound('wall');
                let splitThreshold = activePerks.some(p => p.id === 'shield') ? 6.5 : MIN_SPEED_TO_SPLIT;
                if (hitWall && this.type === 'target' && currentSpeed > splitThreshold && this.multiplyCooldown === 0 && balls.length < MAX_BALLS) {
                    this.multiply();
                }
            }
            multiply() {
                this.multiplyCooldown = 15; ballIdCounter++; 
                let tRad = activePerks.some(p => p.id === 'mini') ? 10 : 15;
                let newBall = new Ball(this.x, this.y, tRad, '#ff1111', 'target', ballIdCounter);
                this.vx *= 0.8; this.vy *= 0.8;
                newBall.vx = this.vx + (Math.random() * 6 - 3); newBall.vy = this.vy + (Math.random() * 6 - 3);
                newBall.multiplyCooldown = 15; balls.push(newBall);
            }
        }

        // --- YENİ: GELECEK SİMÜLASYONU (Predictor) ---
        function predictTrajectory(pullVx, pullVy) {
            // Masanın birebir kopyasını oluştur (Sadece fizik için)
            let simBalls = balls.map((b, index) => ({
                id: index, x: b.x, y: b.y, vx: b.vx, vy: b.vy,
                radius: b.radius, type: b.type, mass: b.mass
            }));
            
            let simObstacles = obstacles.map(o => ({
                x: o.x, y: o.y, r: o.r, isMoving: o.isMoving, vx: o.vx, vy: o.vy
            }));

            // Sadece hayatta kalanların değil, tüm topların yollarını hafızada tut
            let paths = balls.map(b => ({ type: b.type, points: [{x: b.x, y: b.y}] }));
            let pocketedTargetCount = 0;
            
            let simCue = simBalls.find(b => b.type === 'cue');
            if (!simCue) return { paths, pocketedTargetCount };

            simCue.vx = pullVx;
            simCue.vy = pullVy;

            let ghostActive = activePerks.some(p => p.id === 'ghost');
            let isIce = activePerks.some(p => p.id === 'ice');
            let isVortex = activePerks.some(p => p.id === 'vortex');

            let STEPS = 150; // Zamanı 150 kare (2.5 saniye) ileri sar

            for (let step = 0; step < STEPS; step++) {
                if (isVortex) {
                    simBalls.forEach(b => {
                        pockets.forEach(p => {
                            let d = Math.hypot(b.x - p.x, b.y - p.y);
                            if (d < 75 && d > 0) {
                                let forceFactor = b.type === 'cue' ? 0.04 : 0.3; 
                                b.vx += ((p.x - b.x) / d) * forceFactor;
                                b.vy += ((p.y - b.y) / d) * forceFactor;
                            }
                        });
                    });
                }

                // Engel Çarpışmaları (Klonlarda)
                for (let i = 0; i < simBalls.length; i++) {
                    let b = simBalls[i];
                    for (let j = 0; j < simObstacles.length; j++) {
                        let o = simObstacles[j];
                        if (b.type === 'cue' && o.isMoving) continue;
                        let dx = b.x - o.x; let dy = b.y - o.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist < b.radius + o.r) {
                            let nx = dx / dist; let ny = dy / dist;
                            let overlap = b.radius + o.r - dist;
                            b.x += nx * overlap; b.y += ny * overlap;
                            let rvx = b.vx - o.vx; let rvy = b.vy - o.vy;
                            let v_dot = rvx * nx + rvy * ny;
                            if (v_dot < 0) {
                                b.vx -= 2 * v_dot * nx; b.vy -= 2 * v_dot * ny;
                                b.vx *= 1.2; b.vy *= 1.2;
                            }
                        }
                    }
                }

                // Topların Birbirine Çarpması (Klonlarda)
                for (let i = 0; i < simBalls.length; i++) {
                    for (let j = i + 1; j < simBalls.length; j++) {
                        let b1 = simBalls[i]; let b2 = simBalls[j];
                        let dx = b2.x - b1.x; let dy = b2.y - b1.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist < 0.1) { dx = 0.1; dy = 0.1; dist = 0.14; }
                        if (dist < b1.radius + b2.radius) {
                            let isGhost = false;
                            if (b1.type === 'cue' && ghostActive && b2.type === 'target') {
                                b2.vx += b1.vx * 1.5; b2.vy += b1.vy * 1.5;
                                ghostActive = false; isGhost = true;
                            } else if (b2.type === 'cue' && ghostActive && b1.type === 'target') {
                                b1.vx += b2.vx * 1.5; b1.vy += b2.vy * 1.5;
                                ghostActive = false; isGhost = true;
                            }
                            if (isGhost) continue;
                            let overlap = (b1.radius + b2.radius - dist) / 2;
                            let nx = dx / dist; let ny = dy / dist;
                            b1.x -= nx * overlap; b1.y -= ny * overlap;
                            b2.x -= nx * overlap; b2.y -= ny * overlap; // Klon fizikte b2 zıt itilir (Hata engelleme)
                            b2.x += nx * overlap * 2; b2.y += ny * overlap * 2; 

                            let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                            let p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);
                            b1.vx -= p * b2.mass * nx; b1.vy -= p * b2.mass * ny;
                            b2.vx += p * b1.mass * nx; b2.vy += p * b1.mass * ny;
                        }
                    }
                }

                // Klonların Hareket Etmesi
                let currentFriction = isIce ? 0.994 : FRICTION;
                for (let i = 0; i < simBalls.length; i++) {
                    let b = simBalls[i];
                    let currentSpeed = Math.hypot(b.vx, b.vy);
                    if (currentSpeed > MAX_SPEED) {
                        let ratio = MAX_SPEED / currentSpeed; b.vx *= ratio; b.vy *= ratio;
                    }
                    b.x += b.vx; b.y += b.vy;
                    b.vx *= currentFriction; b.vy *= currentFriction;
                    
                    if (Math.abs(b.vx) < 0.05) b.vx = 0;
                    if (Math.abs(b.vy) < 0.05) b.vy = 0;

                    let hitWall = false;
                    if (b.x - b.radius <= 0) { b.x = b.radius; b.vx *= -1; hitWall = true; }
                    else if (b.x + b.radius >= canvas.width) { b.x = canvas.width - b.radius; b.vx *= -1; hitWall = true; }
                    if (b.y - b.radius <= 0) { b.y = b.radius; b.vy *= -1; hitWall = true; }
                    else if (b.y + b.radius >= canvas.height) { b.y = canvas.height - b.radius; b.vy *= -1; hitWall = true; }

                    if (hitWall && b.type === 'cue' && ghostActive) {
                        b.vx *= 0.5; b.vy *= 0.5;
                    }

                    // İz Bırak (Sadece gözle görülür hızı olanlar ve performansı korumak için 2 karede 1 iz atar)
                    if (step % 2 === 0 && Math.hypot(b.vx, b.vy) > 0.5) {
                        paths[b.id].points.push({x: b.x, y: b.y});
                    }
                }

                // Klonların Deliklere Düşmesi
                for (let i = simBalls.length - 1; i >= 0; i--) {
                    let b = simBalls[i];
                    for (let p of pockets) {
                        if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
                            if (b.type === 'target') pocketedTargetCount++;
                            simBalls.splice(i, 1);
                            break;
                        }
                    }
                }

                simObstacles.forEach(o => {
                    if (o.isMoving) {
                        o.x += o.vx; o.y += o.vy;
                        if (o.x - o.r < 0) { o.x = o.r; o.vx *= -1; }
                        if (o.x + o.r > canvas.width) { o.x = canvas.width - o.r; o.vx *= -1; }
                        if (o.y - o.r < 0) { o.y = o.r; o.vy *= -1; }
                        if (o.y + o.r > canvas.height) { o.y = canvas.height - o.r; o.vy *= -1; }
                    }
                });
            }
            return { paths, pocketedTargetCount };
        }

        function triggerExplosion(x, y, color = null) {
            for (let i = 0; i < 20; i++) particles.push(new Particle(x, y, color));
        }

        function startNewRun() {
            activePerks = []; currentLevel = 1; totalShots = 0;
            updateHUDText(); startLevel();
        }

        function startLevel() {
            gameState = 'playing'; gameEnded = false;
            balls = []; particles = []; comboTexts = []; obstacles = [];
            ballIdCounter = 1; currentCombo = 0; comboAppliedThisShot = false;
            
            cueBall = new Ball(200, 600, 15, '#ecf0f1', 'cue'); balls.push(cueBall);

            let targetCount = currentLevel;
            let targetRadius = activePerks.some(p => p.id === 'mini') ? 10 : 15;

            for(let i=0; i<targetCount; i++) {
                let tx = 50 + Math.random() * 300; let ty = 50 + Math.random() * 350; 
                balls.push(new Ball(tx, ty, targetRadius, '#ff1111', 'target', ballIdCounter++));
            }

            let obsCount = Math.floor(currentLevel / 2); if (obsCount > 4) obsCount = 4; 
            for (let i=0; i<obsCount; i++) {
                let isMoving = currentLevel >= 5 && Math.random() > 0.5; 
                let ox = 80 + Math.random() * 240; let oy = 250 + Math.random() * 200; 
                obstacles.push(new Obstacle(ox, oy, 25, isMoving));
            }

            ballCountEl.innerText = balls.length; canvas.style.pointerEvents = 'auto'; 
        }

        function showUpgrades() {
            gameState = 'upgrading'; upgradeOverlay.style.display = 'flex'; cardsContainer.innerHTML = '';
            canvas.style.pointerEvents = 'none';
            
            let available = ALL_PERKS.filter(p => !activePerks.find(ap => ap.id === p.id));
            available.sort(() => Math.random() - 0.5); let choices = available.slice(0, 3); 

            if(choices.length === 0) { applyUpgrade(null); return; }

            choices.forEach(perk => {
                let card = document.createElement('div'); card.className = 'card'; card.style.borderColor = perk.color;
                card.innerHTML = `<div class="card-title" style="color:${perk.color}">${perk.title}</div><div class="card-pro">${perk.pro}</div><div class="card-con">${perk.con}</div>`;
                card.addEventListener('mousedown', () => applyUpgrade(perk));
                card.addEventListener('touchstart', (e) => { e.preventDefault(); applyUpgrade(perk); });
                cardsContainer.appendChild(card);
            });
        }

        function applyUpgrade(perk) {
            playSound('powerup'); if(perk) activePerks.push(perk);
            upgradeOverlay.style.display = 'none'; currentLevel++; updateHUDText(); startLevel();
        }

        function updateHUDText() {
            shotCountEl.innerText = totalShots; levelDisplayEl.innerText = currentLevel;
            perksDisplayEl.innerText = activePerks.length > 0 ? activePerks.map(p => p.title.split(' ')[1]).join(', ') : 'Yok';
        }

        function checkCollisions() {
            for (let i = 0; i < balls.length; i++) {
                let b = balls[i];
                for (let j = 0; j < obstacles.length; j++) {
                    let o = obstacles[j];
                    if (b.type === 'cue' && o.isMoving) continue;
                    let dx = b.x - o.x; let dy = b.y - o.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < b.radius + o.r) {
                        playSound('bumper');
                        let nx = dx / dist; let ny = dy / dist;
                        let overlap = b.radius + o.r - dist;
                        b.x += nx * overlap; b.y += ny * overlap;
                        let rvx = b.vx - o.vx; let rvy = b.vy - o.vy;
                        let v_dot = rvx * nx + rvy * ny;
                        if (v_dot < 0) {
                            b.vx -= 2 * v_dot * nx; b.vy -= 2 * v_dot * ny;
                            b.vx *= 1.2; b.vy *= 1.2;
                        }
                    }
                }
            }

            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i]; let b2 = balls[j];
                    let dx = b2.x - b1.x; let dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 0.1) { dx = 0.1; dy = 0.1; dist = 0.14; }
                    if (dist < b1.radius + b2.radius) {
                        playSound('collide', 1 + (Math.random() * 0.2 - 0.1));
                        let isCueTargetHit = (b1.type === 'cue' && b2.type === 'target') || (b2.type === 'cue' && b1.type === 'target');
                        if (isCueTargetHit && activePerks.some(p => p.id === 'explode') && cueBall.canExplode) {
                            cueBall.canExplode = false; 
                            let impactX = (b1.x + b2.x) / 2; let impactY = (b1.y + b2.y) / 2;
                            triggerExplosion(impactX, impactY, '#ff3300'); playSound('powerup'); 
                            balls.forEach(b => {
                                if (b.type === 'target') {
                                    let pDist = Math.hypot(b.x - impactX, b.y - impactY);
                                    if (pDist < 160 && pDist > 0) {
                                        let force = (160 - pDist) * 0.09;
                                        b.vx += ((b.x - impactX) / pDist) * force; b.vy += ((b.y - impactY) / pDist) * force;
                                    }
                                }
                            });
                        }

                        let overlap = (b1.radius + b2.radius - dist) / 2;
                        let nx = dx / dist; let ny = dy / dist;
                        b1.x -= nx * overlap; b1.y -= ny * overlap;
                        b2.x += nx * overlap; b2.y += ny * overlap;
                        let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);
                        b1.vx -= p * b2.mass * nx; b1.vy -= p * b2.mass * ny;
                        b2.vx += p * b1.mass * nx; b2.vy += p * b1.mass * ny;
                    }
                }
            }
        }

        function checkPockets() {
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                for (let pocket of pockets) {
                    if (Math.hypot(ball.x - pocket.x, ball.y - pocket.y) < pocket.r) {
                        if (ball.type === 'cue') {
                            playSound('pocket', 0);
                            ball.x = 200; ball.y = 600; ball.vx = 0; ball.vy = 0;
                        } else {
                            currentCombo++; playSound('pocket', currentCombo); triggerExplosion(ball.x, ball.y);
                            let comboTextStr = "KOMBO X" + currentCombo;
                            if (currentCombo >= 8) comboTextStr = "KAOS X" + currentCombo;
                            else if (currentCombo >= 5) comboTextStr = "MEGA X" + currentCombo;
                            else if (currentCombo >= 3) comboTextStr = "SÜPER X" + currentCombo;
                            comboTexts.push(new ComboText(ball.x, ball.y, comboTextStr));

                            if (currentCombo > 1 && activePerks.some(p => p.id === 'combo_score') && !comboAppliedThisShot) {
                                totalShots--; shotCountEl.innerText = totalShots; comboAppliedThisShot = true;
                                comboTexts.push(new ComboText(ball.x, ball.y + 25, "-1 ATIŞ SİLİNDİ", true));
                                playSound('powerup');
                            }
                            balls.splice(i, 1);
                        }
                        break; 
                    }
                }
            }
        }

        function drawEndScreen(title, subtitle, color) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = 'white'; ctx.font = '15px Arial'; ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop); 

            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            if (gameState === 'playing' && activePerks.some(p => p.id === 'vortex')) {
                balls.forEach(b => {
                    pockets.forEach(p => {
                        let d = Math.hypot(b.x - p.x, b.y - p.y);
                        if (d < 75 && d > 0) {
                            let forceFactor = b.type === 'cue' ? 0.04 : 0.3; 
                            b.vx += ((p.x - b.x) / d) * forceFactor; b.vy += ((p.y - b.y) / d) * forceFactor;
                        }
                    });
                });
            }

            pockets.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); ctx.closePath(); });

            obstacles.forEach(obs => { if(gameState === 'playing') obs.update(); obs.draw(); });

            if (gameState === 'playing') { checkCollisions(); checkPockets(); }

            balls.forEach(ball => { if (gameState === 'playing') ball.update(); ball.draw(); });

            for (let i = particles.length - 1; i >= 0; i--) { 
                if (gameState === 'playing') particles[i].update(); particles[i].draw(); if (particles[i].alpha <= 0) particles.splice(i, 1); 
            }
            for (let i = comboTexts.length - 1; i >= 0; i--) { 
                if (gameState === 'playing') comboTexts[i].update(); comboTexts[i].draw(); if (comboTexts[i].alpha <= 0) comboTexts.splice(i, 1); 
            }

            if (gameState === 'playing' && balls.every(b => Math.hypot(b.vx, b.vy) < 0.1)) currentCombo = 0;

            if (gameState === 'playing') {
                let targetBalls = balls.filter(b => b.type === 'target');
                if (targetBalls.length === 0 && balls.length > 0) {
                    gameState = 'level_clear'; if (!gameEnded) { playSound('win'); gameEnded = true; }
                    setTimeout(showUpgrades, 1000); 
                } else if (balls.length >= MAX_BALLS) {
                    gameState = 'gameover'; if (!gameEnded) { playSound('gameover'); gameEnded = true; }
                }
            }

            if (gameState === 'gameover') {
                drawEndScreen("💀 MASA PATLADI", "Toplam Atış: " + totalShots + " | Ulaşılan Seviye: " + currentLevel, "#e74c3c");
            } else if (gameState === 'level_clear') {
                drawEndScreen("🎉 ODA TEMİZLENDİ", "Yeni özellikler yükleniyor...", "#2ecc71");
            }

            // --- YENİ GELECEK GÖSTERİMİ VE TAHMİN ÇİZİMLERİ ---
            if (gameState === 'playing' && isDragging && cueBall) {
                let dx = dragStart.x - dragCurrent.x; 
                let dy = dragStart.y - dragCurrent.y;
                let pullDist = Math.hypot(dx, dy);

                if (pullDist > 0.5) {
                    if (pullDist > 200) { dx = (dx / pullDist) * 200; dy = (dy / pullDist) * 200; }
                    
                    // Simülatörü çalıştır
                    let prediction = predictTrajectory(dx * 0.15, dy * 0.15);

                    // 1. Simüle Edilmiş Tüm Rota Çizgilerini Çiz
                    prediction.paths.forEach(pathObj => {
                        if (pathObj.points.length < 2) return;
                        ctx.beginPath();
                        ctx.moveTo(pathObj.points[0].x, pathObj.points[0].y);
                        for (let i = 1; i < pathObj.points.length; i++) {
                            ctx.lineTo(pathObj.points[i].x, pathObj.points[i].y);
                        }
                        
                        if (pathObj.type === 'cue') {
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.lineWidth = 2.5;
                            ctx.setLineDash([5, 8]);
                        } else {
                            // Kırmızı hedef topların rotası
                            ctx.strokeStyle = 'rgba(255, 50, 50, 0.7)';
                            ctx.lineWidth = 1.5;
                            ctx.setLineDash([3, 5]);
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);
                    });

                    // 2. Lazerin üzerindeki Dinamik Güç Barını Çiz
                    let dirX = dx / pullDist; 
                    let dirY = dy / pullDist;
                    let clampedPull = Math.min(pullDist, 200);
                    let speedPercent = clampedPull / 200;
                    let powerLength = speedPercent * 100; 
                    let barR = Math.floor(255 * speedPercent); let barG = Math.floor(255 * (1 - speedPercent));

                    ctx.beginPath(); ctx.moveTo(cueBall.x + dirX * 18, cueBall.y + dirY * 18); ctx.lineTo(cueBall.x + dirX * (18 + powerLength), cueBall.y + dirY * (18 + powerLength));
                    ctx.strokeStyle = `rgb(${barR}, ${barG}, 40)`; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();

                    // 3. Güç Yüzdesi Yazısı
                    ctx.fillStyle = `rgb(${barR}, ${barG}, 40)`; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    let perpX = -dirY; let perpY = dirX;
                    ctx.save(); ctx.shadowColor = 'black'; ctx.shadowBlur = 3;
                    ctx.fillText(`%${Math.floor(speedPercent * 100)}`, cueBall.x + dirX * (25 + powerLength) + perpX * 12, cueBall.y + dirY * (25 + powerLength) + perpY * 12);
                    ctx.restore();

                    // 4. PARMAĞIN YANINDA: KAÇ TOP GİRECEK METNİ ÇİZİMİ
                    ctx.save();
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 4;
                    
                    // Yazı, mobilde parmağın hemen üstünde / sağında çıksın ki parmak yazıyı kapatmasın
                    let textPosX = dragCurrent.x + 25;
                    let textPosY = dragCurrent.y - 25;

                    if (prediction.pocketedTargetCount > 0) {
                        ctx.fillStyle = '#2ecc71'; // Yeşil (Girecek)
                        ctx.font = 'bold 18px Arial';
                        ctx.fillText(`+${prediction.pocketedTargetCount} GİRECEK!`, textPosX, textPosY);
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; // Sönük Beyaz (0 top)
                        ctx.font = '14px Arial';
                        ctx.fillText(`0 TOP`, textPosX, textPosY);
                    }
                    ctx.restore();
                }
            }

            ballCountEl.innerText = balls.length; 
            ballCountEl.style.color = (balls.length > 80) ? "#e74c3c" : "white";
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX || 0;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY || 0;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handleStart(e) {
            initAudioEngine(); 
            if (gameState === 'gameover') { startNewRun(); return; }
            if (gameState !== 'playing') return;
            if (Math.hypot(cueBall.vx, cueBall.vy) > 0.1) return;

            const pos = getPointerPos(e);
            isDragging = true; dragStart = {x: pos.x, y: pos.y}; dragCurrent = {x: pos.x, y: pos.y};
            comboAppliedThisShot = false; 
        }

        function handleMove(e) {
            if (!isDragging || gameState !== 'playing') return;
            const pos = getPointerPos(e); dragCurrent = { x: pos.x, y: pos.y };
        }

        function handleEnd(e) {
            if (!isDragging || gameState !== 'playing') return;
            isDragging = false;

            let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
            let pullDist = Math.hypot(dx, dy);

            if (pullDist > 200) { dx = (dx / pullDist) * 200; dy = (dy / pullDist) * 200; }

            if(Number.isFinite(dx) && Number.isFinite(dy) && pullDist > 15){
                totalShots++; shotCountEl.innerText = totalShots;
                cueBall.vx = dx * 0.15; cueBall.vy = dy * 0.15;
                cueBall.canExplode = true; 
                playSound('shoot');
            }
        }

        canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(e); }, { passive: false });

        startNewRun();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
