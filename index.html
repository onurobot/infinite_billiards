<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bilardo Kaosu: Roguelite</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; 
            background-color: #1a252f;
            color: white;
            font-family: Arial, sans-serif;
            position: fixed;
            inset: 0; 
            display: flex;
            justify-content: center;
            overflow: hidden; 
            touch-action: none;
        }

        #gameWrapper {
            width: 100%;
            height: 100%;
            max-width: 420px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 10px;
            box-sizing: border-box;
            gap: 10px; 
            position: relative;
        }
        
        h2 { margin: 5px 0 0 0; font-size: 18px; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; color: #f39c12; }

        #canvasContainer {
            flex: 1; 
            width: 100%;
            min-height: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            background-color: #27ae60;
            border: 5px solid #2c3e50;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 2; 
            display: block;
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #info {
            text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; flex-shrink: 0; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;
        }
        
        .stats-row { display: flex; justify-content: space-around; font-weight: bold; }

        /* ROGUELITE KART EKRANI - DÜZELTİLDİ */
        #upgradeOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; /* Z-Index en üste alındı */
            border-radius: 12px; backdrop-filter: blur(5px);
            pointer-events: auto; /* Tıklamaları zorla kabul et */
        }
        #upgradeOverlay h3 { color: #f1c40f; margin-bottom: 20px; font-size: 22px; text-align: center; text-shadow: 0 0 10px rgba(241,196,15,0.5); }
        
        #cardsContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: #34495e; width: 85%; padding: 15px; border-radius: 10px;
            border: 2px solid #95a5a6;
            cursor: pointer; transition: transform 0.1s, border-color 0.1s;
            /* Mobil tıklama sorununu çözmek için eklendi */
            pointer-events: auto; 
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.95); }
        .card-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 5px; border-bottom: 1px solid #7f8c8d; padding-bottom: 3px; pointer-events: none; }
        .card-pro { color: #2ecc71; font-size: 12px; margin-bottom: 3px; pointer-events: none; }
        .card-con { color: #e74c3c; font-size: 12px; pointer-events: none; }

    </style>
</head>
<body>

    <div id="gameWrapper">
        <h2>Bilardo Kaosu: Roguelite</h2>
        
        <div id="canvasContainer">
            <canvas id="gameCanvas" width="400" height="800"></canvas>
            
            <div id="upgradeOverlay">
                <h3>Oda Temizlendi!<br><span style="font-size:14px; color:#bdc3c7;">Bir Özellik Seç</span></h3>
                <div id="cardsContainer"></div>
            </div>
        </div>

        <div id="info">
            <div class="stats-row">
                <div>Seviye: <span id="levelDisplay" style="color: #9b59b6;">1</span></div>
                <div>Atış: <span id="shotCount" style="color: #f1c40f;">0</span></div>
            </div>
            <div style="font-size: 12px; color: #bdc3c7;">Top Sayısı: <span id="ballCount">0</span> / 100 | Aktif: <span id="perksDisplay">Yok</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ballCountEl = document.getElementById('ballCount');
        const shotCountEl = document.getElementById('shotCount');
        const levelDisplayEl = document.getElementById('levelDisplay');
        const perksDisplayEl = document.getElementById('perksDisplay');
        const upgradeOverlay = document.getElementById('upgradeOverlay');
        const cardsContainer = document.getElementById('cardsContainer');

        const FRICTION = 0.985; 
        const MAX_BALLS = 100;  
        const MIN_SPEED_TO_SPLIT = 1.0; 
        const MAX_SPEED = 30; 

        const ALL_PERKS = [
            { id: 'heavy', title: 'Ağır Kütle', pro: '+ Kırmızıları paramparça edip uzağa fırlatır.', con: '- Sürtünme artar, çok çabuk yavaşlar.', color: '#7f8c8d' },
            { id: 'ghost', title: 'Hayalet Formu', pro: '+ Çarptığı İLK topun içinden hız kaybetmeden geçer.', con: '- Duvara her çarptığında hızının %50\'sini kaybeder.', color: '#9b59b6' },
            { id: 'trail', title: 'Barut İzi', pro: '+ Arkada bıraktığı alev kırmızıları 3 sn dondurur (Çoğalamazlar).', con: '- Maksimum fırlatma hızın %25 düşer.', color: '#e67e22' },
            { id: 'magnet', title: 'Kararsız Mıknatıs', pro: '+ Dururken etraftaki kırmızıları yavaşça kendine çeker.', con: '- Atış esnasında lazer hafifçe titrer ve sapar.', color: '#3498db' }
        ];
        
        let activePerks = [];
        let currentLevel = 1;
        let totalShots = 0;
        let trails = []; 

        // --- Ses Motoru ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let lastSoundTime = 0; 
        let gameEnded = false; 

        function initAudioEngine() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type, pitchModifier = 1) {
            initAudioEngine();
            if (!audioCtx || audioCtx.state === 'suspended') return;
            let nowTime = Date.now();
            if ((type === 'collide' || type === 'wall') && nowTime - lastSoundTime < 25) return;
            if (type === 'collide' || type === 'wall') lastSoundTime = nowTime;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wall') {
                osc.type = 'square'; osc.frequency.setValueAtTime(180, now); gainNode.gain.setValueAtTime(0.03, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'collide') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(550 * pitchModifier, now); gainNode.gain.setValueAtTime(0.04, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.04); osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'pocket') {
                osc.type = 'sine'; let freq = 250 + (pitchModifier * 60); osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.15); gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'powerup') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now+0.1); osc.frequency.setValueAtTime(800, now+0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        window.addEventListener('touchstart', initAudioEngine, { once: true });
        window.addEventListener('mousedown', initAudioEngine, { once: true });

        let balls = [];
        let particles = []; 
        let comboTexts = []; 
        
        let pockets = [
            {x: 0, y: 0, r: 40}, {x: 400, y: 0, r: 40},       
            {x: 0, y: 400, r: 29}, {x: 400, y: 400, r: 29},   
            {x: 0, y: 800, r: 40}, {x: 400, y: 800, r: 40}    
        ];

        let isDragging = false;
        let dragStart = {x: 0, y: 0};
        let dragCurrent = {x: 0, y: 0};
        let cueBall = null;

        let gameState = 'playing'; 
        let ballIdCounter = 1; 
        let currentCombo = 0; 

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 2;
                const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff00ff', '#00ff00'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.015;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.alpha -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
        }

        class ComboText {
            constructor(x, y, count) {
                this.x = Math.max(50, Math.min(canvas.width - 50, x)); this.y = Math.max(60, Math.min(canvas.height - 40, y - 20));
                this.count = count; this.alpha = 1; this.scale = 1.5;
                if (count >= 8) { this.text = "KAOS X" + count; this.color = "#ff00ff"; }
                else if (count >= 5) { this.text = "MEGA X" + count; this.color = "#f1c40f"; }
                else if (count >= 3) { this.text = "SÜPER X" + count; this.color = "#3498db"; }
                else { this.text = "KOMBO X" + count; this.color = "#ffffff"; }
            }
            update() { this.y -= 0.5; this.alpha -= 0.02; if(this.scale > 1) this.scale -= 0.04; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.font = `bold ${Math.floor(16 * this.scale)}px Arial`; ctx.textAlign = 'center'; ctx.fillText(this.text, this.x, this.y); ctx.restore(); }
        }

        class Ball {
            constructor(x, y, radius, color, type, number = 0) {
                this.x = Number.isFinite(x) ? x : 200; 
                this.y = Number.isFinite(y) ? y : 400; 
                this.vx = 0; this.vy = 0; this.radius = radius; this.color = color;
                this.type = type; this.number = number; this.multiplyCooldown = 15; 
                this.frozenTimer = 0; 
                this.ghostActive = false; 
                
                if (type === 'cue' && activePerks.some(p => p.id === 'heavy')) {
                    this.mass = 3; this.color = '#7f8c8d'; 
                } else {
                    this.mass = 1;
                }
            }

            draw() {
                if (!Number.isFinite(this.x) || !Number.isFinite(this.y)) {
                    this.x = 200; this.y = 400; this.vx = 0; this.vy = 0;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                if (this.frozenTimer > 0 && this.type === 'target') {
                    ctx.fillStyle = '#3498db'; 
                } else {
                    ctx.fillStyle = this.color;
                }

                if (this.type === 'cue' && activePerks.some(p => p.id === 'ghost')) {
                    ctx.save(); ctx.globalAlpha = 0.6; ctx.shadowColor = '#9b59b6'; ctx.shadowBlur = 10;
                }

                ctx.fill();
                ctx.closePath();
                
                if (this.type === 'cue' && activePerks.some(p => p.id === 'ghost')) ctx.restore();

                ctx.beginPath();
                ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
                ctx.arc(this.x - 3, this.y - 3, this.radius / 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();

                if (this.type === 'target') {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 13px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number, this.x, this.y + 1);
                }
            }

            update() {
                if (this.multiplyCooldown > 0) this.multiplyCooldown--;
                if (this.frozenTimer > 0) this.frozenTimer--;

                if (this.type === 'cue' && activePerks.some(p => p.id === 'trail') && Math.hypot(this.vx, this.vy) > 1) {
                    if (Math.random() > 0.6) trails.push({x: this.x, y: this.y, life: 60});
                }

                let currentSpeed = Math.hypot(this.vx, this.vy);
                if (currentSpeed > MAX_SPEED) {
                    let ratio = MAX_SPEED / currentSpeed;
                    this.vx *= ratio; this.vy *= ratio;
                }

                this.x += this.vx; this.y += this.vy;

                if (this.type === 'cue' && activePerks.some(p => p.id === 'heavy')) {
                    this.vx *= 0.96; this.vy *= 0.96;
                } else {
                    this.vx *= FRICTION; this.vy *= FRICTION;
                }

                if (Math.abs(this.vx) < 0.05) this.vx = 0;
                if (Math.abs(this.vy) < 0.05) this.vy = 0;

                let hitWall = false;
                
                if (this.x - this.radius <= 0) { this.x = this.radius; this.vx *= -1; hitWall = true; } 
                else if (this.x + this.radius >= canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; hitWall = true; }
                
                if (this.y - this.radius <= 0) { this.y = this.radius; this.vy *= -1; hitWall = true; } 
                else if (this.y + this.radius >= canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; hitWall = true; }

                if (hitWall) {
                    playSound('wall');
                    if (this.type === 'cue' && activePerks.some(p => p.id === 'ghost')) {
                        this.vx *= 0.5; this.vy *= 0.5;
                    }
                }

                if (hitWall && this.type === 'target' && currentSpeed > MIN_SPEED_TO_SPLIT && this.multiplyCooldown === 0 && balls.length < MAX_BALLS && this.frozenTimer === 0) {
                    this.multiply();
                }
            }

            multiply() {
                this.multiplyCooldown = 15; ballIdCounter++; 
                let newBall = new Ball(this.x, this.y, this.radius, '#ff1111', 'target', ballIdCounter);
                this.vx *= 0.8; this.vy *= 0.8;
                newBall.vx = this.vx + (Math.random() * 6 - 3); newBall.vy = this.vy + (Math.random() * 6 - 3);
                newBall.multiplyCooldown = 15; 
                balls.push(newBall);
            }
        }

        function triggerExplosion(x, y) {
            for (let i = 0; i < 15; i++) particles.push(new Particle(x, y));
        }

        function startNewRun() {
            activePerks = [];
            currentLevel = 1;
            totalShots = 0;
            updateHUDText();
            startLevel();
        }

        function startLevel() {
            gameState = 'playing';
            gameEnded = false;
            balls = []; particles = []; comboTexts = []; trails = [];
            ballIdCounter = 1; currentCombo = 0;
            
            cueBall = new Ball(200, 600, 15, '#ecf0f1', 'cue'); 
            balls.push(cueBall);

            let targetCount = Math.min(1 + Math.floor(currentLevel / 2), 5);
            for(let i=0; i<targetCount; i++) {
                let tx = 100 + Math.random() * 200;
                let ty = 100 + Math.random() * 200;
                balls.push(new Ball(tx, ty, 15, '#ff1111', 'target', ballIdCounter++));
            }
            ballCountEl.innerText = balls.length;
            canvas.style.pointerEvents = 'auto'; // Oyunu aktifleştir
        }

        function showUpgrades() {
            gameState = 'upgrading';
            upgradeOverlay.style.display = 'flex';
            cardsContainer.innerHTML = '';
            
            // Oyun tahtasının tıklamalarını engelle
            canvas.style.pointerEvents = 'none';
            
            let available = ALL_PERKS.filter(p => !activePerks.find(ap => ap.id === p.id));
            available.sort(() => Math.random() - 0.5);
            let choices = available.slice(0, 3); 

            if(choices.length === 0) {
                applyUpgrade(null);
                return;
            }

            choices.forEach(perk => {
                let card = document.createElement('div');
                card.className = 'card';
                card.style.borderColor = perk.color;
                card.innerHTML = `
                    <div class="card-title" style="color:${perk.color}">${perk.title}</div>
                    <div class="card-pro">${perk.pro}</div>
                    <div class="card-con">${perk.con}</div>
                `;
                
                // Güçlü tıklama dinleyicisi (Mobil ve Desktop)
                card.addEventListener('mousedown', () => applyUpgrade(perk));
                card.addEventListener('touchstart', (e) => {
                    e.preventDefault(); 
                    applyUpgrade(perk);
                });
                
                cardsContainer.appendChild(card);
            });
        }

        function applyUpgrade(perk) {
            playSound('powerup');
            if(perk) activePerks.push(perk);
            upgradeOverlay.style.display = 'none';
            currentLevel++;
            updateHUDText();
            startLevel();
        }

        function updateHUDText() {
            shotCountEl.innerText = totalShots;
            levelDisplayEl.innerText = currentLevel;
            perksDisplayEl.innerText = activePerks.length > 0 ? activePerks.map(p => p.title).join(', ') : 'Yok';
        }

        function checkCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i]; let b2 = balls[j];
                    let dx = b2.x - b1.x; let dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 0.1) { dx = 0.1; dy = 0.1; dist = 0.14; }

                    if (dist < b1.radius + b2.radius) {
                        playSound('collide', 1 + (Math.random() * 0.2 - 0.1));

                        let isGhost = false;
                        if (b1.type === 'cue' && b1.ghostActive && b2.type === 'target') {
                            b2.vx += b1.vx * 1.5; b2.vy += b1.vy * 1.5;
                            b1.ghostActive = false; isGhost = true;
                        } else if (b2.type === 'cue' && b2.ghostActive && b1.type === 'target') {
                            b1.vx += b2.vx * 1.5; b1.vy += b2.vy * 1.5;
                            b2.ghostActive = false; isGhost = true;
                        }

                        if (isGhost) continue; 

                        let overlap = (b1.radius + b2.radius - dist) / 2;
                        let nx = dx / dist; let ny = dy / dist;
                        b1.x -= nx * overlap; b1.y -= ny * overlap;
                        b2.x += nx * overlap; b2.y += ny * overlap;

                        let kx = b1.vx - b2.vx; let ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

                        b1.vx -= p * b2.mass * nx; b1.vy -= p * b2.mass * ny;
                        b2.vx += p * b1.mass * nx; b2.vy += p * b1.mass * ny;
                    }
                }
            }
        }

        function checkPockets() {
            for (let i = balls.length - 1; i >= 0; i--) {
                let ball = balls[i];
                for (let pocket of pockets) {
                    if (Math.hypot(ball.x - pocket.x, ball.y - pocket.y) < pocket.r) {
                        if (ball.type === 'cue') {
                            playSound('pocket', 0);
                            ball.x = 200; ball.y = 600; ball.vx = 0; ball.vy = 0;
                        } else {
                            currentCombo++;
                            playSound('pocket', currentCombo);
                            triggerExplosion(ball.x, ball.y);
                            comboTexts.push(new ComboText(ball.x, ball.y, currentCombo));
                            balls.splice(i, 1);
                        }
                        break; 
                    }
                }
            }
        }

        function drawEndScreen(title, subtitle, color) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color; ctx.font = 'bold 34px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = 'white'; ctx.font = '15px Arial'; ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
        }

        function gameLoop() {
            if (gameState === 'upgrading') { requestAnimationFrame(gameLoop); return; }
            if (gameState !== 'playing') { requestAnimationFrame(gameLoop); return; }

            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            let isCueMoving = cueBall ? Math.hypot(cueBall.vx, cueBall.vy) > 0.1 : false;
            if (!isCueMoving && cueBall && activePerks.some(p => p.id === 'magnet')) {
                ctx.strokeStyle = `rgba(52, 152, 219, ${Math.abs(Math.sin(Date.now()/300)) * 0.5})`;
                ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cueBall.x, cueBall.y, 90, 0, Math.PI*2); ctx.stroke();
                
                balls.forEach(b => {
                    if(b.type === 'target') {
                        let d = Math.hypot(b.x - cueBall.x, b.y - cueBall.y);
                        if(d < 100 && d > cueBall.radius + b.radius) {
                            b.vx += (cueBall.x - b.x) * 0.0005;
                            b.vy += (cueBall.y - b.y) * 0.0005;
                        }
                    }
                });
            }

            pockets.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); ctx.closePath(); });

            for (let i = trails.length - 1; i >= 0; i--) {
                let t = trails[i];
                ctx.fillStyle = `rgba(230, 126, 34, ${t.life/60})`;
                ctx.beginPath(); ctx.arc(t.x, t.y, 6, 0, Math.PI*2); ctx.fill();
                t.life--;
                if(t.life <= 0) trails.splice(i, 1);
                else {
                    balls.forEach(b => {
                        if(b.type === 'target' && Math.hypot(b.x - t.x, b.y - t.y) < b.radius + 6) {
                            b.frozenTimer = 180; 
                        }
                    });
                }
            }

            checkCollisions();
            balls.forEach(ball => { ball.update(); ball.draw(); });
            checkPockets();

            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(); if (particles[i].alpha <= 0) particles.splice(i, 1); }
            for (let i = comboTexts.length - 1; i >= 0; i--) { comboTexts[i].update(); comboTexts[i].draw(); if (comboTexts[i].alpha <= 0) comboTexts.splice(i, 1); }

            if (balls.every(b => Math.hypot(b.vx, b.vy) < 0.1)) currentCombo = 0;

            let targetBalls = balls.filter(b => b.type === 'target');
            if (targetBalls.length === 0 && balls.length > 0) {
                if (!gameEnded) { playSound('win'); gameEnded = true; }
                setTimeout(showUpgrades, 1000); 
            } else if (balls.length >= MAX_BALLS) {
                gameState = 'gameover';
                if (!gameEnded) { playSound('gameover'); gameEnded = true; }
                drawEndScreen("💀 MASA PATLADI", "Toplam Atış: " + totalShots + " | Ulaşılan Seviye: " + currentLevel, "#e74c3c");
                
                window.addEventListener('mousedown', () => { if(gameState==='gameover') startNewRun(); }, {once:true});
                window.addEventListener('touchstart', () => { if(gameState==='gameover') startNewRun(); }, {once:true});
            }

            if (isDragging && cueBall) {
                let dx = dragStart.x - dragCurrent.x; 
                let dy = dragStart.y - dragCurrent.y;
                let pullDist = Math.hypot(dx, dy);

                if (pullDist > 0.5) {
                    let dirX = dx / pullDist; 
                    let dirY = dy / pullDist;
                    
                    if(activePerks.some(p => p.id === 'magnet')) {
                        let angle = Math.atan2(dirY, dirX) + (Math.random()*0.1 - 0.05);
                        dirX = Math.cos(angle); dirY = Math.sin(angle);
                    }

                    let min_t = Infinity;
                    let hitBall = null;

                    balls.forEach(b => {
                        if (b.type !== 'target') return;
                        let vX = cueBall.x - b.x;
                        let vY = cueBall.y - b.y;
                        
                        let b_dot = 2 * (vX * dirX + vY * dirY);
                        let c_val = (vX * vX + vY * vY) - Math.pow(cueBall.radius + b.radius, 2);
                        let delta = b_dot * b_dot - 4 * c_val;

                        if (delta >= 0) {
                            let t = (-b_dot - Math.sqrt(delta)) / 2;
                            if (t > 0 && t < min_t) {
                                min_t = t;
                                hitBall = b;
                            }
                        }
                    });

                    let isGhostPerk = activePerks.some(p => p.id === 'ghost');

                    if (hitBall && min_t < 1500) {
                        let impactX = cueBall.x + dirX * min_t;
                        let impactY = cueBall.y + dirY * min_t;

                        let outDx, outDy;
                        if (isGhostPerk) {
                            outDx = dirX; outDy = dirY;
                        } else {
                            outDx = hitBall.x - impactX;
                            outDy = hitBall.y - impactY;
                            let outDist = Math.hypot(outDx, outDy);
                            outDx /= outDist; outDy /= outDist;
                        }

                        ctx.beginPath();
                        ctx.moveTo(cueBall.x, cueBall.y);
                        ctx.lineTo(impactX, impactY);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.beginPath();
                        ctx.arc(impactX, impactY, cueBall.radius, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(hitBall.x, hitBall.y);
                        ctx.lineTo(hitBall.x + outDx * 3000, hitBall.y + outDy * 3000);
                        ctx.strokeStyle = 'rgba(255, 17, 17, 0.8)';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 8]);
                        ctx.stroke();
                        ctx.setLineDash([]);

                    } else {
                        ctx.beginPath(); 
                        ctx.moveTo(cueBall.x, cueBall.y);
                        ctx.lineTo(cueBall.x + dirX * 1500, cueBall.y + dirY * 1500);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; 
                        ctx.lineWidth = 2; 
                        ctx.setLineDash([10, 15]); 
                        ctx.stroke(); 
                        ctx.setLineDash([]); 
                    }

                    let clampedPull = Math.min(pullDist, 200);
                    let speedPercent = clampedPull / 200;
                    let powerLength = speedPercent * 100; 
                    
                    let barR = Math.floor(255 * speedPercent); 
                    let barG = Math.floor(255 * (1 - speedPercent));

                    ctx.beginPath();
                    ctx.moveTo(cueBall.x + dirX * 18, cueBall.y + dirY * 18);
                    ctx.lineTo(cueBall.x + dirX * (18 + powerLength), cueBall.y + dirY * (18 + powerLength));
                    ctx.strokeStyle = `rgb(${barR}, ${barG}, 40)`;
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    ctx.fillStyle = `rgb(${barR}, ${barG}, 40)`;
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    let perpX = -dirY; let perpY = dirX;
                    
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 3;
                    ctx.fillText(`%${Math.floor(speedPercent * 100)}`, 
                        cueBall.x + dirX * (25 + powerLength) + perpX * 12, 
                        cueBall.y + dirY * (25 + powerLength) + perpY * 12
                    );
                    ctx.shadowBlur = 0; 
                }
            }

            ballCountEl.innerText = balls.length; 
            ballCountEl.style.color = (balls.length > 80) ? "#e74c3c" : "white";

            requestAnimationFrame(gameLoop);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX || 0;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY || 0;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handleStart(e) {
            initAudioEngine(); 
            if (gameState !== 'playing') return;
            if (Math.hypot(cueBall.vx, cueBall.vy) > 0.1) return;

            const pos = getPointerPos(e);
            isDragging = true; dragStart = {x: pos.x, y: pos.y}; dragCurrent = {x: pos.x, y: pos.y};
        }

        function handleMove(e) {
            if (!isDragging || gameState !== 'playing') return;
            const pos = getPointerPos(e); dragCurrent = { x: pos.x, y: pos.y };
        }

        function handleEnd(e) {
            if (!isDragging || gameState !== 'playing') return;
            isDragging = false;

            let dx = dragStart.x - dragCurrent.x; let dy = dragStart.y - dragCurrent.y;
            let pullDist = Math.hypot(dx, dy);
            
            if(activePerks.some(p => p.id === 'magnet')) {
                let angle = Math.atan2(dy, dx) + (Math.random()*0.1 - 0.05);
                dx = Math.cos(angle) * pullDist; dy = Math.sin(angle) * pullDist;
            }

            if (pullDist > 200) { dx = (dx / pullDist) * 200; dy = (dy / pullDist) * 200; }

            if(Number.isFinite(dx) && Number.isFinite(dy) && pullDist > 15){
                totalShots++; shotCountEl.innerText = totalShots;
                
                let powerMultiplier = activePerks.some(p => p.id === 'trail') ? 0.75 : 1;
                
                cueBall.vx = dx * 0.15 * powerMultiplier; 
                cueBall.vy = dy * 0.15 * powerMultiplier;
                
                if(activePerks.some(p => p.id === 'ghost')) cueBall.ghostActive = true;

                playSound('shoot');
            }
        }

        canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(e); }, { passive: false });

        startNewRun();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
