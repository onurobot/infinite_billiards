<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilardo Kaosu: Roguelite</title>
    <style>
        body { margin: 0; background-color: #1a252f; display: flex; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        #canvasContainer { position: relative; width: 400px; height: 800px; }
        canvas { background-color: #27ae60; border: 5px solid #2c3e50; border-radius: 12px; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="gameCanvas" width="400" height="800"></canvas>
        <div id="ui">
            <div>Seviye: <span id="level">1</span></div>
            <div>Zaman: <span id="timer">60.0s</span></div>
            <div>Atış: <span id="shots">0</span></div>
        </div>
    </div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Oyun Durumu
let balls = [], obstacles = [], activePerks = [], gameState = 'playing', currentLevel = 1, totalShots = 0, levelTimer = 60;
let cueBall = { x: 200, y: 600, vx: 0, vy: 0, radius: 15, color: '#ecf0f1', type: 'cue' };
balls.push(cueBall);

// Fizik Döngüsü (Her 16ms'de bir)
function update() {
    if (gameState !== 'playing') return;
    
    // Süre
    levelTimer -= 0.016;
    if (levelTimer <= 0) { activePerks = []; levelTimer = 60; }
    document.getElementById('timer').innerText = Math.max(0, levelTimer).toFixed(1) + "s";

    // Hareket
    balls.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        b.vx *= 0.985; b.vy *= 0.985;
        if(Math.abs(b.vx) < 0.05) b.vx = 0;
        if(Math.abs(b.vy) < 0.05) b.vy = 0;
    });

    // Duvar
    balls.forEach(b => {
        if(b.x - b.radius < 0 || b.x + b.radius > 400) b.vx *= -1;
        if(b.y - b.radius < 0 || b.y + b.radius > 800) b.vy *= -1;
    });

    // Çarpışma
    for(let i=0; i<balls.length; i++) {
        for(let j=i+1; j<balls.length; j++) {
            let b1 = balls[i], b2 = balls[j];
            let dist = Math.hypot(b2.x - b1.x, b2.y - b1.y);
            if(dist < b1.radius + b2.radius) {
                let nx = (b2.x - b1.x)/dist; let ny = (b2.y - b1.y)/dist;
                b1.vx -= nx; b1.vy -= ny; b2.vx += nx; b2.vy += ny;
            }
        }
    }
}

// Çizim Döngüsü
function draw() {
    ctx.clearRect(0,0,400,800);
    // Delikler
    ctx.fillStyle = '#111';
    [{x:0,y:0}, {x:400,y:0}, {x:0,y:800}, {x:400,y:800}].forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, Math.PI*2); ctx.fill();
    });
    // Toplar
    balls.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fillStyle = b.color; ctx.fill();
    });
    requestAnimationFrame(draw);
}

// Güvenli Silme (Döngüden bağımsız)
function checkPockets() {
    for(let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i];
        if (b.type !== 'cue' && (b.x < 40 || b.x > 360) && (b.y < 40 || b.y > 760)) {
            balls.splice(i, 1);
        }
    }
}

// Başlatıcılar
setInterval(update, 16);
draw();

// Kontrol
canvas.onmousedown = (e) => {
    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    cueBall.vx = (cueBall.x - mx) * 0.05;
    cueBall.vy = (cueBall.y - my) * 0.05;
    totalShots++;
    document.getElementById('shots').innerText = totalShots;
};
</script>
</body>
</html>
