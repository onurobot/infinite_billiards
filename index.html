<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilardo Kaosu: Roguelite</title>
    <style>
        body { margin: 0; background-color: #1a252f; display: flex; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #canvasContainer { position: relative; width: 400px; height: 800px; }
        canvas { background-color: #27ae60; border: 5px solid #2c3e50; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        #ui { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; }
        #floatingUI { position: absolute; color: #2ecc71; font-weight: bold; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="floatingUI"></div>
    <div id="canvasContainer">
        <canvas id="gameCanvas" width="400" height="800"></canvas>
        <div id="ui">
            <div>Seviye: <span id="level">1</span></div>
            <div>Süre: <span id="timer">60.0s</span></div>
            <div>Atış: <span id="shots">0</span></div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('floatingUI');

let balls = [], obstacles = [], activePerks = [], gameState = 'playing', currentLevel = 1, totalShots = 0, levelTimer = 60, lastTimestamp = 0;
let cueBall = { x: 200, y: 600, vx: 0, vy: 0, radius: 15, color: '#ecf0f1', type: 'cue' };
balls.push(cueBall);

// 1. Fizik Güncellemesi (Güvenli)
function update(dt) {
    if (gameState !== 'playing') return;
    
    levelTimer -= dt;
    if(levelTimer <= 0) { activePerks = []; levelTimer = 60; }
    document.getElementById('timer').innerText = Math.max(0, levelTimer).toFixed(1) + "s";

    balls.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        b.vx *= 0.985; b.vy *= 0.985;
        if(Math.abs(b.vx) < 0.05) b.vx = 0;
        if(Math.abs(b.vy) < 0.05) b.vy = 0;
        // Duvarlar
        if(b.x - b.radius < 0 || b.x + b.radius > 400) b.vx *= -1;
        if(b.y - b.radius < 0 || b.y + b.radius > 800) b.vy *= -1;
    });

    // Engeller
    obstacles.forEach(o => {
        if(o.isMoving) {
            o.x += o.vx; o.y += o.vy;
            if(o.x - o.r < 0 || o.x + o.r > 400) o.vx *= -1;
            if(o.y - o.r < 0 || o.y + o.r > 800) o.vy *= -1;
        }
    });

    // Çarpışma
    for(let i=0; i<balls.length; i++) {
        for(let j=i+1; j<balls.length; j++) {
            let b1 = balls[i], b2 = balls[j];
            let dist = Math.hypot(b2.x - b1.x, b2.y - b1.y);
            if(dist < b1.radius + b2.radius) {
                let nx = (b2.x - b1.x)/dist; let ny = (b2.y - b1.y)/dist;
                b1.vx -= nx; b1.vy -= ny; b2.vx += nx; b2.vy += ny;
            }
        }
    }
}

// 2. Çizim (Kalıcı Döngü)
function draw(timestamp) {
    let dt = (timestamp - lastTimestamp) / 1000; lastTimestamp = timestamp;
    update(dt);
    
    ctx.clearRect(0,0,400,800);
    // Delikler
    ctx.fillStyle = '#111';
    [{x:0,y:0}, {x:400,y:0}, {x:0,y:800}, {x:400,y:800}].forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, Math.PI*2); ctx.fill();
    });
    // Toplar
    balls.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fillStyle = b.color; ctx.fill();
    });
    // Engeller
    obstacles.forEach(o => {
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fillStyle = o.isMoving ? '#e67e22' : '#3498db'; ctx.fill();
    });
    
    requestAnimationFrame(draw);
}

// 3. Güvenli Silme (Döngüden bağımsız)
function checkPockets() {
    for(let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i];
        if (b.type !== 'cue' && (b.x < 40 || b.x > 360) && (b.y < 40 || b.y > 760)) {
            balls.splice(i, 1);
            if (balls.length === 1) { currentLevel++; startLevel(); }
        }
    }
}
setInterval(checkPockets, 100);

// Başlatıcı
function startLevel() {
    document.getElementById('level').innerText = currentLevel;
    balls = [cueBall];
    for(let i=0; i<currentLevel; i++) balls.push({x: 100+Math.random()*200, y: 100+Math.random()*200, vx:0, vy:0, radius:15, color:'#ff1111', type:'target'});
    obstacles = [];
    for(let i=0; i<Math.floor(currentLevel/2); i++) {
        let isMoving = currentLevel >= 5 && Math.random() > 0.5;
        obstacles.push({x: 70 + (i*85), y: 300, r: 25, isMoving: isMoving, vx: isMoving ? 0.5 : 0, vy: isMoving ? 0.5 : 0});
    }
}

// İmleç Takibi
window.onmousemove = (e) => {
    floatingUI.style.left = (e.clientX + 15) + 'px';
    floatingUI.style.top = (e.clientY - 15) + 'px';
    // Buraya simülasyon hesaplamasını bağlayabilirsin
    floatingUI.innerText = "Simüle Ediliyor...";
};

requestAnimationFrame(draw);
startLevel();
</script>
</body>
</html>
